<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">PanoPilot Wireframe 03 - Multi Clip Timeline</title>
<desc id="desc">Low fidelity wireframe for PanoPilot desktop application.</desc>
<style>
  .bg { fill:#f7f7f7; }
  .panel { fill:#ffffff; stroke:#333; stroke-width:1.4; }
  .subtle { fill:#efefef; stroke:#666; stroke-width:1; }
  .dark { fill:#333; }
  .txt { font-family: Inter, Arial, sans-serif; font-size:14px; fill:#222; }
  .small { font-family: Inter, Arial, sans-serif; font-size:12px; fill:#333; }
  .tiny { font-family: Inter, Arial, sans-serif; font-size:10px; fill:#444; }
  .title { font-family: Inter, Arial, sans-serif; font-size:18px; font-weight:700; fill:#111; }
  .label { font-family: Inter, Arial, sans-serif; font-size:12px; font-weight:600; fill:#222; }
  .button { fill:#fff; stroke:#444; stroke-width:1.2; rx:6; ry:6; }
  .buttonDark { fill:#333; stroke:#333; stroke-width:1.2; rx:6; ry:6; }
  .buttonText { font-family: Inter, Arial, sans-serif; font-size:12px; font-weight:600; fill:#222; }
  .buttonTextInv { font-family: Inter, Arial, sans-serif; font-size:12px; font-weight:600; fill:#fff; }
  .line { stroke:#444; stroke-width:1.4; fill:none; }
  .dash { stroke:#777; stroke-width:1.2; stroke-dasharray:5 4; fill:none; }
  .thin { stroke:#777; stroke-width:1; fill:none; }
  .muted { fill:#666; }
  .clip { fill:#e8e8e8; stroke:#444; stroke-width:1.1; rx:5; ry:5; }
  .clipSel { fill:#d8d8d8; stroke:#111; stroke-width:2; rx:5; ry:5; }
  .marker { fill:#fff; stroke:#111; stroke-width:1.5; }
</style>
<rect class="bg" width="1440" height="900"/>

<rect class="panel" x="20" y="18" width="1400" height="52"/>
<text class="title" x="38" y="51">PanoPilot — Project Timeline</text>
<rect class="button" x="1120" y="29" width="80" height="30"/><text class="buttonText" x="1146" y="49">Save</text>
<rect class="buttonDark" x="1250" y="29" width="142" height="30"/><text class="buttonTextInv" x="1296" y="49">Export</text>

<rect class="panel" x="20" y="85" width="1400" height="235"/>
<text class="label" x="38" y="115">Project Preview</text>
<rect x="335" y="130" width="770" height="160" fill="#2e2e2e" stroke="#444"/>
<text x="585" y="215" style="font-family:Inter,Arial,sans-serif;font-size:22px;fill:#ddd;">project playback preview</text>

<rect class="panel" x="20" y="335" width="1400" height="545"/>
<text class="label" x="38" y="365">Project Timeline — drag clips to reorder</text>
<line class="thin" x1="38" y1="390" x2="1392" y2="390"/>

<rect class="clip" x="70" y="430" width="310" height="120"/>
<text class="label" x="88" y="456">Clip A</text>
<text class="tiny" x="88" y="478">Source: CAM_001.OSV</text>
<text class="tiny" x="88" y="498">In 00:21  |  Out 00:44</text>
<rect class="subtle" x="88" y="516" width="274" height="20"/>
<line class="line" x1="120" y1="515" x2="120" y2="540"/>
<line class="line" x1="330" y1="515" x2="330" y2="540"/>
<text class="tiny" x="112" y="564">drag clip</text>

<rect class="clipSel" x="410" y="430" width="310" height="120"/>
<text class="label" x="428" y="456">Clip B (selected)</text>
<text class="tiny" x="428" y="478">Source: CAM_002.OSV</text>
<text class="tiny" x="428" y="498">In 01:04  |  Out 01:19</text>
<rect class="subtle" x="428" y="516" width="274" height="20"/>
<line class="line" x1="470" y1="515" x2="470" y2="540"/>
<line class="line" x1="675" y1="515" x2="675" y2="540"/>
<text class="tiny" x="534" y="564">View Path preserved</text>

<rect class="clip" x="750" y="430" width="310" height="120"/>
<text class="label" x="768" y="456">Clip C</text>
<text class="tiny" x="768" y="478">Source: CAM_003.OSV</text>
<text class="tiny" x="768" y="498">In 02:12  |  Out 02:48</text>
<rect class="subtle" x="768" y="516" width="274" height="20"/>
<line class="line" x1="800" y1="515" x2="800" y2="540"/>
<line class="line" x1="1025" y1="515" x2="1025" y2="540"/>

<rect class="button" x="1100" y="430" width="115" height="34"/><text class="buttonText" x="1127" y="452">+ Add Clips</text>
<rect class="button" x="1100" y="474" width="115" height="34"/><text class="buttonText" x="1127" y="496">Remove</text>

<text class="label" x="70" y="625">Selected Clip Detail</text>
<rect class="subtle" x="70" y="650" width="1240" height="110"/>
<text class="small" x="90" y="678">Trim</text>
<line class="line" x1="160" y1="675" x2="900" y2="675"/>
<polygon points="300,662 312,675 300,688" fill="#333"/>
<polygon points="780,662 768,675 780,688" fill="#333"/>
<text class="tiny" x="278" y="706">IN 01:04</text>
<text class="tiny" x="750" y="706">OUT 01:19</text>

<text class="small" x="90" y="742">Camera Positions</text>
<line class="thin" x1="220" y1="738" x2="900" y2="738"/>
<circle class="marker" cx="350" cy="738" r="7"/>
<circle class="marker" cx="590" cy="738" r="7"/>
<circle class="marker" cx="830" cy="738" r="7"/>
<text class="tiny" x="930" y="742">remain clip-local after reorder</text>

<path class="dash" d="M560 415 C560 380 850 380 850 415"/>
<polygon points="850,415 842,402 858,402" fill="#777"/>
<text class="tiny" x="650" y="374">drag to reorder</text>
</svg>
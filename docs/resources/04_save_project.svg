<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">PanoPilot Wireframe 04 - Save and Open Project</title>
<desc id="desc">Low fidelity wireframe for PanoPilot desktop application.</desc>
<style>
  .bg { fill:#f7f7f7; }
  .panel { fill:#ffffff; stroke:#333; stroke-width:1.4; }
  .subtle { fill:#efefef; stroke:#666; stroke-width:1; }
  .dark { fill:#333; }
  .txt { font-family: Inter, Arial, sans-serif; font-size:14px; fill:#222; }
  .small { font-family: Inter, Arial, sans-serif; font-size:12px; fill:#333; }
  .tiny { font-family: Inter, Arial, sans-serif; font-size:10px; fill:#444; }
  .title { font-family: Inter, Arial, sans-serif; font-size:18px; font-weight:700; fill:#111; }
  .label { font-family: Inter, Arial, sans-serif; font-size:12px; font-weight:600; fill:#222; }
  .button { fill:#fff; stroke:#444; stroke-width:1.2; rx:6; ry:6; }
  .buttonDark { fill:#333; stroke:#333; stroke-width:1.2; rx:6; ry:6; }
  .buttonText { font-family: Inter, Arial, sans-serif; font-size:12px; font-weight:600; fill:#222; }
  .buttonTextInv { font-family: Inter, Arial, sans-serif; font-size:12px; font-weight:600; fill:#fff; }
  .line { stroke:#444; stroke-width:1.4; fill:none; }
  .dash { stroke:#777; stroke-width:1.2; stroke-dasharray:5 4; fill:none; }
  .thin { stroke:#777; stroke-width:1; fill:none; }
  .muted { fill:#666; }
  .clip { fill:#e8e8e8; stroke:#444; stroke-width:1.1; rx:5; ry:5; }
  .clipSel { fill:#d8d8d8; stroke:#111; stroke-width:2; rx:5; ry:5; }
  .marker { fill:#fff; stroke:#111; stroke-width:1.5; }
</style>
<rect class="bg" width="1440" height="900"/>

<rect class="panel" x="20" y="18" width="1400" height="52"/>
<text class="title" x="38" y="51">PanoPilot — Save Project</text>

<rect class="panel" x="360" y="160" width="720" height="520"/>
<text class="title" x="395" y="205">Save PanoPilot Project</text>
<text class="small" x="395" y="242">Project name</text>
<rect class="subtle" x="395" y="255" width="650" height="38"/>
<text class="txt" x="410" y="280">Ilhabela Weekend</text>

<text class="small" x="395" y="330">Project file</text>
<rect class="subtle" x="395" y="343" width="520" height="38"/>
<text class="small" x="410" y="368">~/Videos/PanoPilot/ilhabela.panopilot</text>
<rect class="button" x="930" y="343" width="115" height="38"/><text class="buttonText" x="955" y="367">Browse...</text>

<text class="label" x="395" y="425">Saved project state</text>
<text class="small" x="415" y="455">✓ Source recording references</text>
<text class="small" x="415" y="480">✓ Clip order and trim ranges</text>
<text class="small" x="415" y="505">✓ Output frame</text>
<text class="small" x="415" y="530">✓ Camera Positions / View Paths</text>
<text class="small" x="415" y="555">✓ Edit state needed to reproduce project</text>

<rect class="button" x="785" y="610" width="110" height="38"/><text class="buttonText" x="820" y="634">Cancel</text>
<rect class="buttonDark" x="910" y="610" width="135" height="38"/><text class="buttonTextInv" x="949" y="634">Save Project</text>

<text class="small muted" x="395" y="590">Original .OSV files are never modified.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">PanoPilot Wireframe 02 - Main Reframe Workspace</title>
<desc id="desc">Low fidelity wireframe for PanoPilot desktop application.</desc>
<style>
  .bg { fill:#f7f7f7; }
  .panel { fill:#ffffff; stroke:#333; stroke-width:1.4; }
  .subtle { fill:#efefef; stroke:#666; stroke-width:1; }
  .dark { fill:#333; }
  .txt { font-family: Inter, Arial, sans-serif; font-size:14px; fill:#222; }
  .small { font-family: Inter, Arial, sans-serif; font-size:12px; fill:#333; }
  .tiny { font-family: Inter, Arial, sans-serif; font-size:10px; fill:#444; }
  .title { font-family: Inter, Arial, sans-serif; font-size:18px; font-weight:700; fill:#111; }
  .label { font-family: Inter, Arial, sans-serif; font-size:12px; font-weight:600; fill:#222; }
  .button { fill:#fff; stroke:#444; stroke-width:1.2; rx:6; ry:6; }
  .buttonDark { fill:#333; stroke:#333; stroke-width:1.2; rx:6; ry:6; }
  .buttonText { font-family: Inter, Arial, sans-serif; font-size:12px; font-weight:600; fill:#222; }
  .buttonTextInv { font-family: Inter, Arial, sans-serif; font-size:12px; font-weight:600; fill:#fff; }
  .line { stroke:#444; stroke-width:1.4; fill:none; }
  .dash { stroke:#777; stroke-width:1.2; stroke-dasharray:5 4; fill:none; }
  .thin { stroke:#777; stroke-width:1; fill:none; }
  .muted { fill:#666; }
  .clip { fill:#e8e8e8; stroke:#444; stroke-width:1.1; rx:5; ry:5; }
  .clipSel { fill:#d8d8d8; stroke:#111; stroke-width:2; rx:5; ry:5; }
  .marker { fill:#fff; stroke:#111; stroke-width:1.5; }
</style>
<rect class="bg" width="1440" height="900"/>

<rect class="panel" x="20" y="18" width="1400" height="52"/>
<text class="title" x="38" y="51">PanoPilot</text>
<rect class="button" x="170" y="29" width="90" height="30"/><text class="buttonText" x="194" y="49">Add Clips</text>
<rect class="button" x="270" y="29" width="70" height="30"/><text class="buttonText" x="293" y="49">Save</text>
<rect class="button" x="350" y="29" width="64" height="30"/><text class="buttonText" x="370" y="49">Undo</text>
<rect class="button" x="424" y="29" width="64" height="30"/><text class="buttonText" x="444" y="49">Redo</text>
<text class="small" x="1040" y="49">Output</text>
<rect class="button" x="1090" y="29" width="76" height="30"/><text class="buttonText" x="1116" y="49">16:9 ▾</text>
<rect class="buttonDark" x="1250" y="29" width="142" height="30"/><text class="buttonTextInv" x="1296" y="49">Export</text>

<rect class="panel" x="20" y="85" width="230" height="570"/>
<text class="label" x="38" y="115">Clips</text>
<rect class="clipSel" x="38" y="135" width="194" height="82"/>
<rect class="subtle" x="46" y="143" width="88" height="50"/>
<text class="tiny" x="55" y="171">thumbnail</text>
<text class="small" x="143" y="162">Clip 01</text>
<text class="tiny" x="143" y="184">01:10–01:42</text>
<text class="tiny" x="143" y="202">Preview ready</text>

<rect class="clip" x="38" y="229" width="194" height="82"/>
<rect class="subtle" x="46" y="237" width="88" height="50"/>
<text class="tiny" x="55" y="265">thumbnail</text>
<text class="small" x="143" y="256">Clip 02</text>
<text class="tiny" x="143" y="278">00:03–00:26</text>
<text class="tiny" x="143" y="296">Preparing 64%</text>

<rect class="clip" x="38" y="323" width="194" height="82"/>
<rect class="subtle" x="46" y="331" width="88" height="50"/>
<text class="tiny" x="55" y="359">thumbnail</text>
<text class="small" x="143" y="350">Clip 03</text>
<text class="tiny" x="143" y="372">Full clip</text>
<text class="tiny" x="143" y="390">Preview ready</text>

<rect class="panel" x="265" y="85" width="930" height="570"/>
<text class="label" x="282" y="115">Reframe Preview</text>
<rect x="295" y="130" width="870" height="490" fill="#151515" stroke="#444"/>
<rect x="390" y="190" width="680" height="382" fill="#3b3b3b" stroke="#f2f2f2" stroke-width="2"/>
<text x="620" y="360" style="font-family:Inter,Arial,sans-serif;font-size:28px;fill:#ddd;font-weight:600;">360° PANORAMIC SCENE</text>
<text x="574" y="398" style="font-family:Inter,Arial,sans-serif;font-size:16px;fill:#bbb;">drag anywhere to look around</text>
<path d="M690 430 C640 430 630 470 600 470" stroke="#ddd" stroke-width="2" fill="none"/>
<polygon points="595,470 607,464 607,476" fill="#ddd"/>
<path d="M770 430 C820 430 830 470 860 470" stroke="#ddd" stroke-width="2" fill="none"/>
<polygon points="865,470 853,464 853,476" fill="#ddd"/>
<text class="small" x="462" y="600" fill="#ddd">Output frame</text>

<rect class="panel" x="1210" y="85" width="210" height="570"/>
<text class="label" x="1228" y="115">Camera</text>
<text class="small" x="1228" y="152">Explore mode</text>
<rect class="button" x="1228" y="170" width="164" height="34"/><text class="buttonText" x="1275" y="192">Reset View</text>
<rect class="buttonDark" x="1228" y="216" width="164" height="42"/><text class="buttonTextInv" x="1250" y="242">Use this view</text>
<line class="thin" x1="1228" y1="280" x2="1392" y2="280"/>
<text class="small" x="1228" y="310">Viewpoint</text>
<text class="tiny" x="1228" y="336">Orientation: visual only</text>
<text class="tiny" x="1228" y="354">Zoom: mouse wheel</text>
<text class="tiny" x="1228" y="372">Horizon: default</text>
<text class="small" x="1228" y="420">Selected Camera Position</text>
<text class="tiny" x="1228" y="446">00:11.2</text>
<rect class="button" x="1228" y="466" width="78" height="30"/><text class="buttonText" x="1249" y="486">Update</text>
<rect class="button" x="1314" y="466" width="78" height="30"/><text class="buttonText" x="1335" y="486">Delete</text>

<rect class="panel" x="20" y="670" width="1400" height="210"/>
<text class="label" x="38" y="698">Timeline</text>
<rect class="button" x="38" y="711" width="36" height="30"/><text class="buttonText" x="50" y="731">▶</text>
<text class="small" x="88" y="731">00:11.2 / 00:32.0</text>
<line class="line" x1="185" y1="726" x2="1385" y2="726"/>
<line class="line" x1="615" y1="713" x2="615" y2="739"/>

<text class="tiny" x="38" y="765">Selected clip detail</text>
<rect class="clipSel" x="185" y="748" width="400" height="48"/>
<text class="small" x="205" y="776">Clip 01   In 01:10   Out 01:42</text>
<circle class="marker" cx="280" cy="815" r="8"/><text class="tiny" x="260" y="840">A</text>
<circle class="marker" cx="420" cy="815" r="8"/><text class="tiny" x="400" y="840">B</text>
<circle class="marker" cx="540" cy="815" r="8"/><text class="tiny" x="520" y="840">C</text>
<line class="thin" x1="280" y1="815" x2="540" y2="815"/>
<text class="tiny" x="600" y="786">Camera Positions / View Path</text>
</svg>